<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>보고서 수정 사항 기록기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6 lg:px-8">

  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- 상단 헤더 -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-indigo-600 text-white font-bold text-sm">R</span>
          <h1 class="text-xl font-bold text-slate-900">보고서 수정 및 추가 사항 기록</h1>
        </div>
        <p class="text-sm text-slate-500 mt-1">작성된 내용은 연결된 Google 스프레드시트에 실시간으로 저장됩니다.</p>
      </div>
      <a href="https://docs.google.com/spreadsheets/d/1eRfRtOAkfyQVGa14o6YP6YQxVgQBZH27MtAUbrG4x-E/edit" 
         target="_blank" 
         class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl hover:bg-emerald-100 transition-colors">
        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
        </svg>
        스프레드시트 열기
      </a>
    </header>

    <!-- 알림 메시지 영역 (alert 대체) -->
    <div id="toastBanner" class="hidden rounded-xl p-4 text-sm font-medium transition-all duration-300 flex items-center justify-between">
      <span id="toastMessage"></span>
      <button onclick="hideToast()" class="text-current opacity-70 hover:opacity-100 font-bold ml-4">✕</button>
    </div>

    <!-- 입력 폼 카드 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
      <form id="revisionForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
        
        <!-- 1. 어느 부분에서 수정할지 -->
        <div>
          <label for="location" class="block text-sm font-semibold text-slate-800 mb-2">
            1. 수정 위치 <span class="text-indigo-600 font-normal">(어느 부분에서 수정할지)</span> <span class="text-rose-500">*</span>
          </label>
          <input type="text" id="location" name="location" required
            placeholder="예: 3페이지 2번째 문단, II. 시장 분석 표, 결론 요약 파트 등"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- 2. 뭘로 수정할지 -->
          <div>
            <label for="modification" class="block text-sm font-semibold text-slate-800 mb-2">
              2. 수정 내용 <span class="text-indigo-600 font-normal">(뭘로 수정할지)</span>
            </label>
            <textarea id="modification" name="modification" rows="4"
              placeholder="기존 내용을 어떤 문구나 수치로 변경할지 입력하세요."
              class="w-full px-4 py-3 rounded-xl border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition resize-none"></textarea>
          </div>

          <!-- 3. 뭘 추가할지 -->
          <div>
            <label for="addition" class="block text-sm font-semibold text-slate-800 mb-2">
              3. 추가 내용 <span class="text-indigo-600 font-normal">(뭘 추가할지)</span>
            </label>
            <textarea id="addition" name="addition" rows="4"
              placeholder="새롭게 보완하거나 추가해야 할 근거, 도표, 설명 등을 입력하세요."
              class="w-full px-4 py-3 rounded-xl border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition resize-none"></textarea>
          </div>
        </div>

        <!-- 제출 버튼 -->
        <div class="pt-2 flex items-center justify-end gap-3">
          <button type="button" onclick="resetForm()"
            class="px-5 py-2.5 text-sm font-medium text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200 transition">
            초기화
          </button>
          <button type="submit" id="submitBtn"
            class="px-6 py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-200 transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
            <span id="submitBtnText">시트에 기록하기</span>
            <svg id="submitSpinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </button>
        </div>
      </form>
    </section>

    <!-- 최근 기록된 내역 목록 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-bold text-slate-900">최근 기록된 수정 사항</h2>
        <button onclick="loadRevisions()" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          새로고침
        </button>
      </div>

      <div id="loadingList" class="text-center py-8 text-slate-400 text-sm">
        데이터를 불러오는 중입니다...
      </div>

      <div id="emptyList" class="hidden text-center py-10 bg-slate-50 rounded-xl border border-dashed border-slate-200">
        <p class="text-slate-500 text-sm">아직 기록된 수정 사항이 없습니다. 위 양식에서 첫 번째 내용을 입력해 보세요.</p>
      </div>

      <div id="revisionList" class="space-y-4"></div>
    </section>

  </div>

  <script>
    // 페이지 로드 시 최근 내역 불러오기
    window.addEventListener('DOMContentLoaded', loadRevisions);

    // 토스트 알림 표시
    function showToast(message, isSuccess = true) {
      const banner = document.getElementById('toastBanner');
      const msgEl = document.getElementById('toastMessage');
      
      banner.className = `rounded-xl p-4 text-sm font-medium transition-all duration-300 flex items-center justify-between ${
        isSuccess 
          ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' 
          : 'bg-rose-50 text-rose-800 border border-rose-200'
      }`;
      msgEl.textContent = message;
      banner.classList.remove('hidden');

      setTimeout(hideToast, 4000);
    }

    function hideToast() {
      document.getElementById('toastBanner').classList.add('hidden');
    }

    function resetForm() {
      document.getElementById('revisionForm').reset();
    }

    // 폼 제출 처리
    function handleFormSubmit(e) {
      e.preventDefault();
      
      const location = document.getElementById('location').value.trim();
      const modification = document.getElementById('modification').value.trim();
      const addition = document.getElementById('addition').value.trim();

      if (!modification && !addition) {
        showToast('수정 내용 또는 추가 내용 중 최소 한 가지는 입력해 주세요.', false);
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('submitBtnText');
      const spinner = document.getElementById('submitSpinner');

      submitBtn.disabled = true;
      btnText.textContent = '저장 중...';
      spinner.classList.remove('hidden');

      google.script.run
        .withSuccessHandler(function(response) {
          submitBtn.disabled = false;
          btnText.textContent = '시트에 기록하기';
          spinner.classList.add('hidden');

          if (response.success) {
            showToast(response.message, true);
            resetForm();
            loadRevisions();
          } else {
            showToast(response.message, false);
          }
        })
        .withFailureHandler(function(error) {
          submitBtn.disabled = false;
          btnText.textContent = '시트에 기록하기';
          spinner.classList.add('hidden');
          showToast('서버 통신 오류가 발생했습니다: ' + error.message, false);
        })
        .saveRevision({ location, modification, addition });
    }

    // 최근 목록 렌더링
    function loadRevisions() {
      const loadingEl = document.getElementById('loadingList');
      const emptyEl = document.getElementById('emptyList');
      const listEl = document.getElementById('revisionList');

      loadingEl.classList.remove('hidden');
      emptyEl.classList.add('hidden');
      listEl.innerHTML = '';

      google.script.run
        .withSuccessHandler(function(items) {
          loadingEl.classList.add('hidden');

          if (!items || items.length === 0) {
            emptyEl.classList.remove('hidden');
            return;
          }

          items.forEach(item => {
            const isDone = item.status === '완료';
            const card = document.createElement('div');
            card.className = `p-5 rounded-xl border transition ${
              isDone ? 'bg-slate-50 border-slate-200 opacity-75' : 'bg-white border-slate-200 hover:border-indigo-300'
            }`;

            card.innerHTML = `
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-1 text-xs font-semibold rounded-md bg-indigo-50 text-indigo-700">
                    📍 ${escapeHtml(item.location)}
                  </span>
                  <span class="text-xs text-slate-400">${escapeHtml(item.timestamp)}</span>
                </div>
                <button onclick="changeStatus(${item.rowNumber}, '${isDone ? '대기중' : '완료'}')"
                  class="px-3 py-1 text-xs font-semibold rounded-full border transition cursor-pointer ${
                    isDone 
                      ? 'bg-emerald-100 text-emerald-800 border-emerald-200 hover:bg-emerald-200' 
                      : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'
                  }">
                  ${isDone ? '✓ 반영 완료' : '⏳ 대기중 (클릭시 완료)'}
                </button>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                <div class="bg-slate-50 p-3 rounded-lg">
                  <span class="block text-xs font-semibold text-slate-500 mb-1">수정 내용 (뭘로 수정)</span>
                  <p class="text-slate-800 whitespace-pre-wrap">${escapeHtml(item.modification)}</p>
                </div>
                <div class="bg-slate-50 p-3 rounded-lg">
                  <span class="block text-xs font-semibold text-slate-500 mb-1">추가 내용 (뭘 추가)</span>
                  <p class="text-slate-800 whitespace-pre-wrap">${escapeHtml(item.addition)}</p>
                </div>
              </div>
            `;
            listEl.appendChild(card);
          });
        })
        .withFailureHandler(function(error) {
          loadingEl.classList.add('hidden');
          showToast('목록을 불러오지 못했습니다: ' + error.message, false);
        })
        .getRecentRevisions();
    }

    // 처리 상태 토글
    function changeStatus(rowNumber, newStatus) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            loadRevisions();
          } else {
            showToast('상태 변경 실패: ' + res.message, false);
          }
        })
        .toggleStatus(rowNumber, newStatus);
    }

    // XSS 방지용 이스케이프 함수
    function escapeHtml(str) {
      if (!str) return '-';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
